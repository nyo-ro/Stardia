<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Stardia — 小さな学びを、未来につなぐ学習ダッシュボード。">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Stardia — 学びのダッシュボード</title>
<link rel="icon" href="./mark.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css">
<script type="module" src="./src/app.js"></script>
</head>
<body>
<a class="skip" href="#main">学習内容へ移動</a>
<header class="header"><a class="brand" href="./"><img src="./mark.svg" alt="" width="42" height="42"><span>Stardia<small>小さな学びを、未来につなぐ。</small></span></a><div class="header-right"><span class="version">v0.0.2 · Preview</span><button class="button quiet" id="settings-toggle" aria-expanded="true" aria-controls="settings">表示設定</button></div></header>
<div class="preview-note"><span class="badge" id="mode-label"></span><p id="mode-description"></p><button id="switch-mode" class="button quiet">デモを試す</button></div>
<div class="workspace-tools"><label>表示日 <input id="view-date" type="date" aria-label="計画の表示日"></label><button id="project-edit" class="button">プロジェクト作成</button><button id="task-add" class="button">＋ 計画を追加</button><button id="reload-data" class="button quiet">最新データを確認</button><p id="save-status" role="status" aria-live="polite"></p></div>
<div class="shell"><main id="main" tabindex="-1"><div class="page-title"><div><p class="eyebrow">YOUR LEARNING SPACE</p><h1>学びのダッシュボード</h1></div><p id="today-label"></p></div><div id="dashboard" class="dashboard"></div><section class="hidden-panel" id="hidden-cards" aria-label="非表示中のカード"></section></main>
<aside id="settings" class="settings"><h2>表示設定</h2><p class="muted">自分に合う、学びの場所に。</p><div id="settings-content"></div><p id="settings-status" role="status" class="muted small"></p></aside></div>
<footer>STARDIA <span>一歩ずつ、自分のペースで。</span><span>ブラウザ内保存 · 完全バックアップは今後追加予定</span></footer>
<dialog id="record-dialog" aria-labelledby="record-title"><form id="record-form"><div class="section-heading"><h2 id="record-title">学習を記録する</h2><button class="button quiet" type="button" data-close="record-dialog">閉じる</button></div><p class="muted mode-help"></p><label>日付<input name="date" id="record-date" type="date" required></label><label>学習した内容<input name="subject" maxlength="100" required></label><label>学習時間（分）<input name="minutes" type="number" min="1" max="1440" step="1" value="25" required></label><label>メモ<textarea name="note" maxlength="1000" rows="3"></textarea></label><button type="button" class="button quiet" data-refresh>入力を残して最新データを確認</button><p class="form-error" id="form-error" role="alert"></p><div class="form-actions"><button class="button primary" type="submit">保存する</button><button id="record-delete" class="button danger" type="button">この記録を削除</button></div></form></dialog>
<dialog id="task-dialog" aria-labelledby="task-title"><form id="task-form"><div class="section-heading"><h2 id="task-title">学習計画</h2><button class="button quiet" type="button" data-close="task-dialog">閉じる</button></div><p class="muted mode-help"></p><label>項目名<input name="title" maxlength="100" required></label><label>予定日<input name="date" type="date" required></label><label>予定時間（分）<input name="minutes" type="number" min="1" max="1440" step="1" value="25" required></label><label class="inline-label"><input name="required" type="checkbox" checked>必須の学習</label><button type="button" class="button quiet" data-refresh>入力を残して最新データを確認</button><p class="form-error" role="alert"></p><div class="form-actions"><button class="button primary" type="submit">保存する</button><button id="task-delete" class="button danger" type="button">この項目を削除</button></div></form></dialog>
<dialog id="project-dialog" aria-labelledby="project-title"><form id="project-form"><div class="section-heading"><h2 id="project-title">プロジェクト</h2><button class="button quiet" type="button" data-close="project-dialog">閉じる</button></div><p class="muted mode-help"></p><label>名前<input name="name" maxlength="100" required></label><label>目標<textarea name="goal" maxlength="300" rows="3"></textarea></label><button type="button" class="button quiet" data-refresh>入力を残して最新データを確認</button><p class="form-error" role="alert"></p><div class="form-actions"><button class="button primary" type="submit">保存する</button><button id="project-delete" class="button danger" type="button">プロジェクトを削除</button></div></form></dialog>
<p id="notice" role="status" class="notice"></p>
<noscript>Stardiaを利用するにはJavaScriptを有効にしてください。</noscript>
</body></html>
