<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Stardia — 小さな学びを、未来につなぐ学習ダッシュボード。">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Stardia — 学びのダッシュボード</title>
<link rel="icon" href="./mark.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css">
<script type="module" src="./src/app.js"></script>
</head>
<body>
<a class="skip" href="#main">学習内容へ移動</a>
<header class="header"><a class="brand" href="./"><img src="./mark.svg" alt="" width="42" height="42"><span>Stardia<small>小さな学びを、未来につなぐ。</small></span></a><div class="header-right"><span class="version">v0.0.1 · Preview</span><button class="button quiet" id="settings-toggle" aria-expanded="true" aria-controls="settings">表示設定</button></div></header>
<div class="preview-note"><span class="badge">架空データ</span><p>ここは体験用のダッシュボードです。学習記録・進捗は再読み込みでリセットされます。表示設定だけ、このブラウザに保存します。</p></div>
<div class="shell"><main id="main" tabindex="-1"><div class="page-title"><div><p class="eyebrow">YOUR LEARNING SPACE</p><h1>学びのダッシュボード</h1></div><p id="today-label"></p></div><div id="dashboard" class="dashboard"></div><section class="hidden-panel" id="hidden-cards" aria-label="非表示中のカード"></section></main>
<aside id="settings" class="settings"><h2>表示設定</h2><p class="muted">自分に合う、学びの場所に。</p><div id="settings-content"></div><p id="settings-status" role="status" class="muted small"></p></aside></div>
<footer>STARDIA <span>一歩ずつ、自分のペースで。</span><span>学習データの永続保存・バックアップは今後追加予定</span></footer>
<dialog id="record-dialog" aria-labelledby="record-title"><form id="record-form"><div class="section-heading"><h2 id="record-title">学習を記録する</h2><button class="button quiet" type="button" id="close-dialog" aria-label="閉じる">閉じる</button></div><p class="muted">今回開いている間だけの体験用記録です。</p><label>日付<input name="date" id="record-date" type="date" required></label><label>学習した内容<input name="subject" maxlength="100" placeholder="例：英語のリスニング" required></label><label>学習時間（分）<input name="minutes" type="number" min="1" max="1440" step="1" value="25" required></label><label>メモ<textarea name="note" maxlength="1000" rows="3" placeholder="今日の気づきをひとこと"></textarea></label><p id="form-error" role="alert"></p><button class="button primary" type="submit">体験用の記録を追加</button></form></dialog>
<p id="notice" role="status" class="notice"></p>
<noscript>Stardiaを利用するにはJavaScriptを有効にしてください。</noscript>
</body></html>
